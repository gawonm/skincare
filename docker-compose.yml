name: skincare

services:
  postgres:
    # ParadeDB = PostgreSQL + pg_search(BM25) + pgvector(벡터).
    # 태그를 고정한다. 확장 버전이 올라가면 마이그레이션이 필요하기 때문이다.
    image: paradedb/paradedb:0.18.6-pg17
    container_name: skincare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # 바이트 순서 정렬. 호스트 glibc 버전이 달라도 인덱스 동작이 같다.
      # 한국어 사전순 정렬이 필요하면 이 줄을 지운다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      # pg_search 는 백그라운드 워커를 쓴다. 이 줄이 없으면
      # `CREATE EXTENSION pg_search` 가 실패한다.
      - -c
      - shared_preload_libraries=pg_search
      - -c
      - max_connections=200
      # BM25 인덱스 생성은 메모리를 많이 쓴다.
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - timezone=UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: skincare-redis
    restart: unless-stopped
    command:
      - redis-server
      # AOF. 재시작해도 최근 쓰기를 잃지 않는다.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      # 캐시용 설정. 큐나 세션처럼 지워지면 안 되는 데이터면 noeviction 으로 바꾼다.
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
