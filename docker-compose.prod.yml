# 배포용 오버레이. 단독으로 쓰지 않고 기본 파일과 겹쳐서 실행한다.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# postgres 와 redis 정의를 여기에 다시 쓰지 않는 이유는, 두 벌이 되면 한쪽만 고쳐서
# 개발과 배포의 DB 설정이 조용히 달라지기 때문이다.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skincare-backend
    restart: unless-stopped
    depends_on:
      # DB 와 Redis 가 healthy 가 된 뒤에 뜬다. 먼저 뜨면 lifespan 의 ping 에서 죽는다.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: UTC
    volumes:
      # 앱의 설정 소스는 config.yaml 하나뿐이다(core/config.py). 이미지에 굽지 않고
      # 여기서 읽기 전용으로 넣는다. 컨테이너 안에서는 DB 주소가 localhost 가 아니라
      # 서비스 이름(postgres, redis)이어야 한다. config.prod.yaml.sample 참고.
      #
      # 호스트 쪽 파일명이 config.prod.yaml 인 이유는, 개발용 config.yaml(localhost 주소)과
      # 한 머신에 공존할 수 있어야 하기 때문이다. 같은 이름을 쓰면 개발 설정이 그대로
      # 마운트되어 컨테이너가 DB 에 닿지 못하고 재시작을 반복한다.
      # 컨테이너 안쪽 경로는 core/config.py 가 config.yaml 만 읽으므로 그대로 둔다.
      - ./config.prod.yaml:/app/config.yaml:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # FastAPI 가 뜨면 /docs 가 응답한다. 별도 헬스 엔드포인트가 생기면 그쪽으로 바꾼다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
