# The connection URL comes from config.yaml and is read by migrations/env.py.
# The sqlalchemy.url below is a placeholder Alembic requires; it is never used.
# Keep this file ASCII-only: Alembic reads it with the system locale encoding.

[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
